
services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev

    ports:
      - "3001:3000"
    env_file:
      - ./client/.env
    
    volumes:
      - ./client:/app
      - /app/node_modules

    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules
    
    restart: unless-stopped